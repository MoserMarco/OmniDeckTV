<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Remote</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <div id="everyThing">
        <div class="FirstRow">
            <div class="imgButton">
                <img src="{{ url_for('static', filename='Images/PowerOff.png') }}" onclick="sendKey('POWEROFF')">

            </div>
            <div class="imgButton">
                <img src="{{ url_for('static', filename='Images/Mouse.png') }}" onclick="mouse()">
            </div>
        </div>

    <div class="remote-pad">
        <!-- up arrow -->
        <div class="arrow arrow-up " onclick="sendKey('UPARROW')">
            <img  src="{{ url_for('static', filename='Images/Up.png') }}" >
        </div>

        <!-- left arrow-->
        <div class="arrow arrow-left " onclick="sendKey('LEFTARROW')">
            <img  src="{{ url_for('static', filename='Images/Left.png') }}" >
        </div>



        <!-- right arrow-->
        <div class="arrow arrow-right " onclick="sendKey('RIGHTARROW')">
            <img  src="{{ url_for('static', filename='Images/Right.png') }}" >
        </div>

        <!-- down arrow-->
        <div class="arrow arrow-down "  onclick="sendKey('DOWNARROW')">
            <img  src="{{ url_for('static', filename='Images/Down.png') }}" >
        </div>

        <!-- enter -->
        <button class="enter-btn " onclick="sendKey('ENTER')">OK</button>
    </div>
    <div class="lastRow">
        <div class="imgButton">
            <img src="{{ url_for('static', filename='Images/Pause.png') }}" onclick="sendKey('PAUSE')">
        </div>
        <div class="imgButton">
            <img src="{{ url_for('static', filename='Images/VolumeUp.png') }}" onclick="sendKey('VOLUMEUP')">
        </div>
        <div class="imgButton">
            <img src="{{ url_for('static', filename='Images/Back.png') }}" onclick="sendKey('BACK')">
        </div>
    </div>
    <br id="brBeetwenButtons">
    <div class="lastRow">
        <div class="imgButton">
            <img src="{{ url_for('static', filename='Images/Home.png') }}" onclick="sendKey('HOME')">

        </div>
        <div class="imgButton">
            <img src="{{ url_for('static', filename='Images/VolumeDown.png') }}" onclick="sendKey('VOLUMEDOWN')">
        </div>
        <div class="imgButton">
            <img src="{{ url_for('static', filename='Images/CloseSoftware.png') }}" onclick="sendKey('CLOSESOFTWARE')">
        </div>
    </div>
    </div>


    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
