<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="everyThingMouse">
        <div class="MouseRow">
            <div class="imgButton">
                <img src="{{ url_for('static', filename='Images/Remote.png') }}" onclick="remote()">
            </div>
        </div>


        <div class="joystick" id="joystick">
            <div class="stick" id="stick"></div>
        </div>


        <div class="MouseRow">
                <div class="imgButton">
                    <img src="{{ url_for('static', filename='Images/MouseLeft.png') }}" onclick="sendKey('LEFTCLICK')">

                </div>
                 <div class="volume">
                     <div class="imgButton">
                        <img src="{{ url_for('static', filename='Images/ScrollUp.png') }}" onclick="sendKey('SCROLLUP')">
                    </div>
                     <br id="brBeetwenButtons">
                     <div class="imgButton">
                        <img src="{{ url_for('static', filename='Images/ScrollDown.png') }}" onclick="sendKey('SCROLLDOWN')">
                    </div>
                </div>
                <div class="imgButton">
                    <img src="{{ url_for('static', filename='Images/MouseRight.png') }}" onclick="sendKey('RIGHTCLICK')">
                </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
